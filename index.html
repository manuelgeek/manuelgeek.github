    <meta name="theme-color" content="#FBE74A">
    <script>
        // Resolve the theme before first paint, otherwise the page flashes
        // light before Vue mounts. Mirrors the logic in useTheme.ts.
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = stored || (dark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#15242f' : '#FBE74A');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
